# Worked example of a *justified relaxation*, which is the case the reason rule exists for.
#
# A product installed and operated by the customer: we can ship a fix, we cannot deploy it.
# Holding it to a 21-day remediation deadline would mark almost every finding as breached,
# and a breach signal that always fires carries no information.

product: example-onprem
tier: Extended
# The tier is not set here — it follows from the customer SLA (GDG-004-01's Basic/Extended
# vocabulary is the same one). Name the contract it comes from so the value can be traced.
tier_source: ""          # e.g. "SLA <customer>, service level Basic" — fill in from the contract
# Superseded by maintenance_interval (§3.4); kept as an observation only.
release_cadence: quarterly
cra_scope: true

tracks:
  immediate:
    mitigation: 72h        # unchanged — we can still publish an advisory and a workaround
    remediation: 60d
    reason: >-
      Customer-operated on-premise installation. We control the release, the operator
      controls the deploy, so "fix live" is not ours to meet in 21 days. 60 d reflects the
      contractual maintenance window. Mitigation stays at 72 h because publishing the
      advisory and a compensating control is entirely within our control.

# §3.4 — the maintenance commitment. Not an observation of how often this product has
# released, but a promise: a maintenance release happens at least this often. Every open
# Track 3/4 finding lands on the next window, so a missed window is one decision about a
# release rather than one per finding. The tier caps how loose this may be (Basic: 90d).
# Extended tier caps this at 60d, and on-prem is where that matters: a customer running an
# older installation cannot be reached by our next deploy.
maintenance_interval: 60d

# Set when this product was first monitored. Windows that elapsed before that date are
# recorded as history, not as breaches — nobody could have acted on them.
onboarded: ""            # fill in on the first monitored run

alerts:
  slack_channel: C0EXAMPLE
  threshold: high
