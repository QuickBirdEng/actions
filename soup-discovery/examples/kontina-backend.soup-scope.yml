# Scope declaration for QuickBirdEng/kontina-backend.
#
# Worked example on the proposed pilot project: a Python backend deployed to k8s.
# 13 candidates, 2 ecosystems. Every entry needs a `reason`; an exclusion without one
# fails the run.
#
# Rules match by exact `id` or by `path` prefix on any of a candidate's markers.

include:
  - id: server
    reason: >-
      The application itself. requirements.txt is pinned (==), so it identifies exact
      versions and is a valid resolved set.

  - id: docker-production-image-12
    reason: >-
      Final stage of docker/production/Dockerfile — the image that actually ships.
      Contributes the base image's OS packages, which are in CVE scope.

  - id: deployed-qb-gid-server-0.1.6
    reason: >-
      Our own GID server, deployed alongside the backend. In scope; its own SBOM is
      produced by its own repo, this entry records the deployed version.

  - id: deployed-epa4all-rest-service-v1.2.2
    reason: >-
      Third-party ePA REST service deployed into the namespace. Built elsewhere, so its
      contents are outside our control but inside our CVE scope.

  - id: deployed-wireguard-1.0.20210914
    reason: >-
      WireGuard sidecar carrying production traffic. Note the version is from 2021 —
      flag against the dependency currency policy.

  - id: deployed-redis-8.8.1-alpine
    reason: Redis runs in production (k8s/redis/resources.yml), not only in local compose.

exclude:
  - id: docker-production-image-1
    reason: Build stage of the production Dockerfile. Does not ship.

  - id: tests
    reason: Test-only requirements (tests/requirements-test.txt). Never deployed.

  - path: docker/docker-compose-local.yml
    reason: >-
      Local developer compose stack — the `server`, `migrations` and postgres services
      there are the local harness, not the deployed system. The deployed postgres is a
      managed service, not this image.

  - id: deployed-ubuntu-curl-latest
    reason: >-
      Init/utility container used for a readiness probe. Pinned to `latest`, so it is not
      reproducible; treated as out of scope until it is pinned, and tracked as a hygiene
      item rather than silently included.

  - id: deployed-IMAGE_WITH_TAG
    reason: >-
      Placeholder substituted by the deploy pipeline — it is the backend's own image,
      already covered by `docker-production-image-12`. Which concrete version is live is
      not knowable from this repo; see DEV-196.
