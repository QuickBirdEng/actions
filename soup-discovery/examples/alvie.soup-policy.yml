# Per-product policy for QuickBirdEng/alvie. Sits next to .soup-scope.yml.
#
# Everything not stated here comes from the process defaults (policy-defaults.yml). A longer
# deadline or a higher threshold needs a `reason:`.
#
# DRAFT. tier, cra_scope and production_release.detect_by all need a decision — the last is
# not optional here, see below.

product: alvie
# tier, cra_scope and maintenance_interval are agreed with the customer in the SLA and written
# here. They are not determined in this repo — do not reason them out. Changing one of them
# changes a real obligation, which is why this file is owned in CODEOWNERS and why the backstop
# reports when any of them moves between runs.
tier: Basic
cra_scope: unknown

# Measured from the clean-semver tags: v1.0.7 (2025-10-01), v1.0.4 (2025-06-23) — about a
# quarter apart, and nothing since. Declared quarterly, this currently reads as broken
# (~305 days since the last one).
# Superseded by maintenance_interval (§3.4); kept as an observation only.
release_cadence: quarterly

# THIS NEEDS A DECISION, and it moves a deadline by ten months.
#
# The three signals that could mark a production release name three different releases:
#
#   tag_pattern       v1.0.7       2025-10-01     (clean semver)
#   prerelease_flag   v1.0.8-qa30  2026-05-04     (a -qa tag marked as a full release)
#   production_asset  v1.0.4       2025-06-23     (last release with a -production artifact)
#
# Track 3 remediation is "next release", so whichever of these is true sets every Track 3
# deadline for this product. The backstop reports the disagreement on every run until this
# is set to the signal the project actually maintains.
production_release:
  detect_by: tag_pattern

# §3.4 — the maintenance commitment. Not an observation of how often this product has
# released, but a promise: a maintenance release happens at least this often. Every open
# Track 3/4 finding lands on the next window, so a missed window is one decision about a
# release rather than one per finding. The tier caps how loose this may be (Basic: 90d).
maintenance_interval: 90d

# Set when this product was first monitored. Windows that elapsed before that date are
# recorded as history, not as breaches — nobody could have acted on them.
onboarded: ""            # fill in on the first monitored run
# §3.6 — the onboarding baseline. Findings already present when monitoring started run their
# clocks from `baseline_clocks_start` instead of from the first scan, because nobody could have
# acted on them earlier. KEV is always exempt. Leaving baseline_clocks_start empty means there is
# no baseline: the whole existing backlog becomes due at once, which on kontina-backend was 23
# Critical findings inside two weeks.
baseline_clocks_start: ""   # the date the pre-existing backlog becomes due; agree it with the plan

alerts:
  slack_channel: ""
  threshold: high
