# Scope declaration for QuickBirdEng/mindnet — the pilot project.
#
# 34 candidates across 6 ecosystems: a Flutter app, a web monorepo, three Keycloak Java
# extensions, a Terraform root and 25 container references. The most varied repo in the
# portfolio, which is why it is the pilot.
#
# Rules match by exact `id` or by `path` prefix on any marker. An `id` rule beats a `path`
# rule. Every entry needs a `reason`; an exclusion without one fails the run.
#
# DRAFT — the scope calls below are proposals from reading the repo, not decisions. They
# need the project's confirmation before this file is committed to mindnet.

include:
  # --- the medical device itself ------------------------------------------------
  - id: app
    reason: The Flutter app. pubspec.lock is the resolved set.

  - id: app-android
    reason: >-
      Android build of the app. Contributes the Android/Kotlin side of the shipped APK,
      which pubspec.lock does not cover.

  - id: web
    reason: >-
      The web monorepo root. Its yarn.lock is the resolved set for every workspace member
      under web/packages/ that has no lockfile of its own.

  - id: keycloak-admin-client
    reason: Ships as part of the web stack and carries its own yarn.lock.

  - id: strapi
    reason: >-
      The CMS that serves product content. Its own yarn.lock; deployed as
      qbsdocker/mindnet-strapi.

  # --- Java extensions running inside Keycloak ----------------------------------
  # Invisible to the current org tooling entirely. They are our own code compiled into
  # JARs and loaded into the identity provider, so their dependencies are in CVE scope.
  - id: keycloak-offline-session-limiter-extension
    reason: Keycloak provider extension we build and deploy. Its Maven dependencies are SOUP.
  - id: keycloak-two-factor-auth-extension
    reason: Keycloak provider extension we build and deploy. Handles 2FA — security-relevant.
  - id: request-param-conditional-authenticator
    reason: Keycloak provider extension we build and deploy. Part of the authentication flow.

  # --- runtime base images that actually ship -----------------------------------
  - id: web-dockerfiles-image-28
    reason: Final stage of Dockerfile.react — the shipped web UI image base.
  - id: web-dockerfiles-image-30
    reason: Final stage of Dockerfile.node — the shipped REST API image base.
  - id: web-packages-keycloak-image-1
    reason: The Keycloak image we build; base image contents are in CVE scope.
  - id: web-packages-strapi-image-2
    reason: The Strapi image we build; base image contents are in CVE scope.
  - id: deployment-k8s-utils-sentry-proxy-image-1
    reason: Sentry proxy image, deployed in production.
  - id: deployment-k8s-utils-apple-app-site-association-image-1
    reason: >-
      Serves the apple-app-site-association file for universal links. Small, but it is a
      production-facing web server.

  # --- third-party services deployed into the namespace -------------------------
  - id: deployed-epa4all-rest-service-v1.2.4
    reason: >-
      ePA REST service handling patient-record traffic. Built by a third party, so its
      contents are outside our control and squarely inside our CVE scope.
  - id: deployed-qb-gid-server-0.1.7
    reason: Our own GID server. This entry records the deployed version; its SBOM comes from its own repo.
  - id: deployed-wireguard-1.0.20210914
    reason: >-
      WireGuard sidecar carrying ePA traffic. Version dates from 2021 — flag against the
      dependency currency policy.
  - id: deployed-redis-alpine3.18
    reason: Redis in production (production-redis-deployment.yml).
  - id: deployment-keycloak.tf-main
    reason: Pinned Terraform provider versions for the Keycloak configuration.

  # (Countly moved to exclude — see below.)

exclude:
  # --- build stages that never reach production ---------------------------------
  - id: web-dockerfiles-image-1
    reason: Build stage of Dockerfile.react. Does not ship.
  - id: web-dockerfiles-image-2
    reason: Build stage of Dockerfile.node. Does not ship.

  # --- local developer stack ----------------------------------------------------
  - path: web/docker-compose.local.yml
    reason: >-
      Local developer stack only (mysql, postgres). The deployed databases are managed
      services, not these images.
  - id: deployed-web-strapi-latest
    reason: >-
      Locally built Strapi image from web/docker-compose.yml, tagged `latest`. The
      deployed Strapi is qbsdocker/mindnet-strapi; this entry is the dev-compose variant.

  # --- external service ----------------------------------------------------------
  - path: deployment/k8s-utils/countly/
    reason: >-
      Countly is an external service, not part of the medical device. Decided 2026-08-02.
      Covers its api, frontend and mongo manifests, which are one deployment.
      Note this is a scope call about the *SBOM*, not about the product documentation:
      an external service still belongs in the "Software Tools" / interfacing-systems
      section of the SBOM QMS record (MN-002-03), and it remains subject to the usual
      data-protection assessment. It is simply not a component of the shipped software,
      so its container contents are not our configuration items.

  # --- utility container --------------------------------------------------------
  - id: deployed-ubuntu-with-utils-latest
    reason: >-
      Health-check cron container, pinned to `latest` and therefore not reproducible.
      Out of scope until it is pinned; tracked as a hygiene item rather than silently
      included.

  # --- templated references: our own images, already covered ---------------------
  # Each of these is one of our own images whose tag is substituted at deploy time, so the
  # concrete version is not knowable from this repo (see DEV-196). The image *contents* are
  # already covered by the corresponding build candidate above, so excluding them here does
  # not lose coverage — but the version gap is real and belongs to DEV-196, not here.
  - id: deployed-mindnet-web-ui-version
    reason: Our own web UI image; contents covered by web-dockerfiles-image-28. Version resolution is DEV-196.
  - id: deployed-mindnet-rest-version
    reason: Our own REST API image; contents covered by web-dockerfiles-image-30. Version resolution is DEV-196.
  - id: deployed-mindnet-strapi-version
    reason: Our own Strapi image; contents covered by web-packages-strapi-image-2. Version resolution is DEV-196.
  - id: deployed-mindnet-keycloak-version
    reason: Our own Keycloak image; contents covered by web-packages-keycloak-image-1. Version resolution is DEV-196.
  - id: deployed-mindnet-sentry-proxy-version
    reason: >-
      Our own sentry-proxy image; contents covered by
      deployment-k8s-utils-sentry-proxy-image-1. Version resolution is DEV-196.
  - id: deployed-apple-app-site-association-v1.0.1
    reason: >-
      Our own image, contents covered by
      deployment-k8s-utils-apple-app-site-association-image-1.
