# Per-product policy for QuickBirdEng/dermafy. Sits next to .soup-scope.yml.
#
# Everything not stated here comes from the process defaults (policy-defaults.yml). A longer
# deadline or a higher threshold needs a `reason:`.
#
# DRAFT. tier, cra_scope and production_release.detect_by need decisions.

product: dermafy
# tier, cra_scope and maintenance_interval below are all agreed with the customer in the SLA and
# then written down here — they are not determined in this repo. One contract, one reference.
sla_reference: ""        # e.g. "SLA <customer>, Anhang B, Stand 2026-06-01"
tier: Basic
cra_scope: unknown

# Measured from the clean-semver tags: v1.0.6 (2025-10-15) and v1.0.1 (2024-09-24) — about
# thirteen months apart. Declared biannual and it still reads as broken (~291 days since the
# last one). Set this to the intended cycle rather than to whatever makes the check pass:
# with Track 3 remediation defined as "next release", a declared cadence that nobody keeps
# means Track 3 findings have no real deadline at all, and that is the thing worth seeing.
# Superseded by maintenance_interval (§3.4); kept as an observation only.
release_cadence: biannual

# NEEDS A DECISION. Two signals disagree by about four months:
#
#   tag_pattern       v1.0.6       2025-10-15
#   prerelease_flag   v1.1.0-qa7   2026-02-26     (a -qa tag marked as a full release)
#   production_asset  none         —              (this repo attaches no such artifact)
production_release:
  detect_by: tag_pattern

# §3.4 — the maintenance commitment. Not an observation of how often this product has
# released, but a promise: a maintenance release happens at least this often. Every open
# Track 3/4 finding lands on the next window, so a missed window is one decision about a
# release rather than one per finding. The tier caps how loose this may be (Basic: 90d).
maintenance_interval: 90d

# Set when this product was first monitored. Windows that elapsed before that date are
# recorded as history, not as breaches — nobody could have acted on them.
onboarded: ""            # fill in on the first monitored run

alerts:
  slack_channel: ""
  threshold: high
