name: 'SOUP Discovery + SBOM'
description: 'Discover dependencies across every ecosystem, enforce a recorded scope, and produce a verified CycloneDX SBOM'

inputs:
  product:
    description: 'Product name for the consolidated BOM subject'
    required: true
  version:
    description: 'Product version. Use the release tag; do not leave at a placeholder.'
    required: true
  repo-root:
    description: 'Root to scan'
    required: false
    default: '.'
  scope-file:
    description: 'Scope declaration. Every discovered candidate must be classified in it or the run fails.'
    required: false
    default: '.soup-scope.yml'
  output-dir:
    description: 'Where to write candidates.json, scan-plan.json and bom/'
    required: false
    default: 'sbom'
  syft-version:
    description: 'Pinned syft version. Not "latest" on purpose — the component list must not change because a scanner auto-updated between two runs of the same commit.'
    required: false
    default: '1.20.0'
  keep-timestamp:
    description: 'Set true for the release tier, which needs metadata.timestamp. Leave false for a committable, diffable BOM.'
    required: false
    default: 'false'
  registry-username:
    description: 'Registry login for private images. Without it, private images are recorded as gaps rather than scanned — verified against qbsdocker/*, which is private.'
    required: false
    default: ''
  registry-password:
    description: 'Registry password/token'
    required: false
    default: ''
  registry-server:
    description: 'Registry host'
    required: false
    default: 'docker.io'
  render-pdf:
    description: 'Also render a human-readable PDF from the consolidated bundle — the artifact a release reviewer, auditor or customer reads. Installs reportlab if absent.'
    required: false
    default: 'true'
  upload-artifact:
    description: 'Upload the sbom directory as a workflow artifact'
    required: false
    default: 'true'
  publish-to-release:
    description: >-
      On a tag, attach the bundle to the GitHub release as sbom-<tag>.cdx.json (and the PDF).
      The stable name is what makes the deployed version resolvable to its SBOM (DEV-196) —
      resolve-deployed.sh looks for exactly this asset.
    required: false
    default: 'true'
  repo-token:
    description: 'Token for attaching release assets. Required when publish-to-release is on and the run is on a tag.'
    required: false
    default: ''
  runs-on-note:
    description: 'Unused. Present so callers can document their runner choice; the workflow, not the action, selects the runner.'
    required: false
    default: ''

outputs:
  solution-bom:
    description: 'Path to the consolidated CycloneDX document'
    value: ${{ steps.run.outputs.solution-bom }}
  complete:
    description: 'false if any in-scope candidate could not be scanned'
    value: ${{ steps.run.outputs.complete }}
  gaps:
    description: 'Comma-separated ids of in-scope candidates that produced no BOM'
    value: ${{ steps.run.outputs.gaps }}
  component-count:
    description: 'Components in the consolidated BOM'
    value: ${{ steps.run.outputs.component-count }}

runs:
  using: 'composite'
  steps:
    - name: Check prerequisites
      shell: bash
      run: |
        missing=()
        for t in jq yq curl; do command -v "$t" >/dev/null 2>&1 || missing+=("$t"); done
        if [ ${#missing[@]} -gt 0 ]; then
          echo "::error::missing required tools: ${missing[*]}"
          echo "::error::install them on the runner, or use a runner image that has them"
          exit 1
        fi

    - name: Registry login
      if: ${{ inputs.registry-username != '' }}
      shell: bash
      env:
        REG_PASS: ${{ inputs.registry-password }}
      run: |
        echo "$REG_PASS" | docker login "${{ inputs.registry-server }}" \
          -u "${{ inputs.registry-username }}" --password-stdin

    - name: Install PDF renderer dependency
      if: ${{ inputs.render-pdf == 'true' }}
      shell: bash
      run: python3 -c 'import reportlab' 2>/dev/null || pip3 install --quiet reportlab

    - name: Discover, scope, scan, consolidate
      id: run
      shell: bash
      env:
        RENDER_PDF: ${{ inputs.render-pdf }}
        SBOM_OUT_DIR: ${{ inputs.output-dir }}
        SOUP_SCOPE_FILE: ${{ inputs.scope-file }}
        SYFT_VERSION: ${{ inputs.syft-version }}
        KEEP_TIMESTAMP: ${{ inputs.keep-timestamp == 'true' && '1' || '0' }}
      run: |
        bash "$GITHUB_ACTION_PATH/scripts/run-pipeline.sh" \
          "${{ inputs.product }}" "${{ inputs.version }}" "${{ inputs.repo-root }}"

        SOL="${{ inputs.output-dir }}/bom/solution.cdx.json"
        {
          echo "solution-bom=$SOL"
          echo "complete=$(jq -r '.metadata.properties[] | select(.name=="quickbird:sbom:complete") | .value' "$SOL")"
          echo "gaps=$(jq -r '[.metadata.properties[] | select(.name=="quickbird:sbom:missing") | .value] | join(",")' "$SOL")"
          echo "component-count=$(jq '[.components[]] | length' "$SOL")"
        } >> "$GITHUB_OUTPUT"

    - name: Summary
      shell: bash
      run: |
        {
          echo "### SBOM"
          echo ""
          echo "| | |"
          echo "|---|---|"
          echo "| Components | ${{ steps.run.outputs.component-count }} |"
          echo "| Complete | ${{ steps.run.outputs.complete }} |"
          if [ -n "${{ steps.run.outputs.gaps }}" ]; then
            echo "| Gaps | \`${{ steps.run.outputs.gaps }}\` |"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Attach bundle to the release
      if: ${{ inputs.publish-to-release == 'true' && github.ref_type == 'tag' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.repo-token }}
      run: |
        BOM="${{ inputs.output-dir }}/bom/solution.cdx.json"
        PDF="${{ inputs.output-dir }}/bom/solution.cdx.pdf"
        TAG="${{ github.ref_name }}"
        if [ -z "$GH_TOKEN" ]; then
          echo "::error::publish-to-release is on but repo-token is empty — the bundle would not be attached and the deployed version would have no resolvable SBOM"
          exit 1
        fi
        # Stable, predictable names. resolve-deployed.sh looks for exactly sbom-<tag>.cdx.json;
        # a per-project naming scheme would make the lookup guesswork.
        cp "$BOM" "sbom-$TAG.cdx.json"
        args=("sbom-$TAG.cdx.json")
        [ -f "$PDF" ] && cp "$PDF" "sbom-$TAG.pdf" && args+=("sbom-$TAG.pdf")
        gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes ""
        gh release upload "$TAG" "${args[@]}" --clobber
        echo "attached ${args[*]} to release $TAG"

    - name: Upload SBOM
      if: ${{ inputs.upload-artifact == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: sbom
        path: ${{ inputs.output-dir }}
        retention-days: 90
