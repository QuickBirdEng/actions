# Goes into <product>/.github/workflows/soup-sbom.yml — WI §7 stage #3.
#
# Two triggers, and the reason for each:
#
#   workflow_run   fires when the release workflow has finished. Not `push: tags`, because the
#                  release workflow is what pushes the images of this tag, and an image that is
#                  not in the registry yet cannot be scanned — it would be recorded as a gap. Set
#                  `workflows:` to the release workflow of this product; the name must match the
#                  `name:` inside that file, not its file name.
#
#   workflow_dispatch  to re-run for a tag afterwards: after a scope declaration was completed,
#                  after a credential was added, or to produce the inventory of a version that was
#                  released before this workflow existed.
#
# Placing the reusable workflow as a final job of the release workflow instead removes the
# ordering question altogether, at the cost of editing that workflow. Either is fine; this file
# is the variant that needs no change to an existing release path.

name: SOUP - SBOM

on:
  workflow_run:
    workflows: ["<name of the release workflow>"]
    types: [completed]

  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to produce the inventory for, e.g. v1.2.3'
        required: true
        type: string

permissions:
  contents: write        # attaching the bundle to the release of this tag

jobs:
  sbom:
    # On workflow_run: only for a successful, tag-triggered release run. A failed release did not
    # publish the images, and an inventory of a branch build carries no version identity (WI §7.2).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    uses: QuickBirdEng/workflows/.github/workflows/soup-sbom.yml@main
    with:
      product: <product>
      version: ${{ inputs.tag || github.event.workflow_run.head_branch }}
      ref: ${{ inputs.tag || github.event.workflow_run.head_branch }}
    secrets: inherit
