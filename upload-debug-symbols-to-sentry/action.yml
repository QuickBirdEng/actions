name: 'Upload debug symbols to sentry'
description: 'Upload debug symbols to sentry'
inputs:
  url:
    description: 'Url of the sentry server (in case of a custom one)'
    required: false
  project:
    description: 'Name of the project in sentry'
    required: false
  auth-token:
    description: 'Authorization token for sentry'
    required: false
  organization:
    description: 'Organization name'
    required: false
    default: ''
  symbols-dir:
    description: 'Directory holding one folder per platform as created by restore-debug-symbols (<platform>/dsyms, <platform>/dart-symbols, <platform>/proguard/mapping.txt). Alternative to passing the paths below individually.'
    required: false
    default: ''
  dsyms-path:
    description: 'The path to the dsYMs folder'
    required: false
    default: ''
  proguard-mapping-file-path:
    description: 'The path to the proguard mapping file'
    required: false
    default: ''
  dart-symbols-file-path:
    description: 'The path to the dart symbols file'
    required: false
    default: ''
  dart-obfuscation-map-file-path:
    description: 'The path to the dart obfuscation map JSON file'
    required: false
    default: ''
  release:
    description: 'Sentry release name to create and finalize (e.g. 1.0.0+12345). If empty, release finalization is skipped.'
    required: false
    default: ''
runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install CLI
      shell: bash
      run: npm install -g @sentry/cli
    - name: Sentry CLI Version
      shell: bash
      run: sentry-cli --version
    - name: Upload debug symbols
      shell: bash
      env:
        SENTRY_AUTH_TOKEN: ${{ inputs.auth-token }}
        SENTRY_SERVER_URL: ${{ inputs.url }}
        ORGANIZATION: ${{ inputs.organization }}
        PROJECT: ${{ inputs.project }}
        SYMBOLS_DIR: ${{ inputs.symbols-dir }}
        DSYMS_PATH: ${{ inputs.dsyms-path }}
        PROGUARD_MAPPING_FILE_PATH: ${{ inputs.proguard-mapping-file-path }}
        DART_SYMBOLS_FILE_PATH: ${{ inputs.dart-symbols-file-path }}
        DART_OBFUSCATION_MAP_FILE_PATH: ${{ inputs.dart-obfuscation-map-file-path }}
      run: |
        set -euo pipefail

        cli=(sentry-cli)
        if [[ -n "$SENTRY_SERVER_URL" ]]; then
          cli+=(--url "$SENTRY_SERVER_URL")
        fi
        scope=(--org "$ORGANIZATION" --project "$PROJECT")

        upload_debug_files() {
          echo "Uploading debug files from '$1'"
          "${cli[@]}" debug-files upload "${scope[@]}" "$1"
        }

        upload_dart_symbol_map() {
          local map="$1" symbols_dir="$2"
          for debug_file in "$symbols_dir"/*.symbols; do
            [[ -f "$debug_file" ]] || continue
            echo "Uploading obfuscation map for '$debug_file'"
            "${cli[@]}" dart-symbol-map upload "${scope[@]}" "$map" "$debug_file"
          done
        }

        upload_proguard_mapping() {
          echo "Uploading ProGuard mapping '$1'"
          "${cli[@]}" upload-proguard "${scope[@]}" "$1"
        }

        uploaded=0

        # Directory mode: everything that restore-debug-symbols has put in place.
        if [[ -n "$SYMBOLS_DIR" ]]; then
          if [[ ! -d "$SYMBOLS_DIR" ]]; then
            echo "::error::symbols-dir '$SYMBOLS_DIR' does not exist"
            exit 1
          fi

          for platform_dir in "$SYMBOLS_DIR"/*/; do
            [[ -d "$platform_dir" ]] || continue
            platform_dir="${platform_dir%/}"
            platform="$(basename "$platform_dir")"
            echo "::group::Sentry upload for $platform"

            if [[ -d "$platform_dir/dsyms" ]]; then
              upload_debug_files "$platform_dir/dsyms"
              uploaded=$((uploaded + 1))
            fi

            if [[ -d "$platform_dir/dart-symbols" ]]; then
              upload_debug_files "$platform_dir/dart-symbols"
              uploaded=$((uploaded + 1))
              if [[ -f "$platform_dir/dart-symbols/obfuscation.map.json" ]]; then
                upload_dart_symbol_map "$platform_dir/dart-symbols/obfuscation.map.json" "$platform_dir/dart-symbols"
              fi
            fi

            if [[ -f "$platform_dir/proguard/mapping.txt" ]]; then
              upload_proguard_mapping "$platform_dir/proguard/mapping.txt"
              uploaded=$((uploaded + 1))
            fi

            echo "::endgroup::"
          done

          if [[ "$uploaded" -eq 0 ]]; then
            echo "::error::No debug symbols found under '$SYMBOLS_DIR'"
            exit 1
          fi
        fi

        # Explicit paths, for callers that upload straight from a build job.
        if [[ -n "$DART_SYMBOLS_FILE_PATH" ]]; then
          if [[ -d "$DART_SYMBOLS_FILE_PATH" ]]; then
            upload_debug_files "$DART_SYMBOLS_FILE_PATH"
            uploaded=$((uploaded + 1))
            if [[ -n "$DART_OBFUSCATION_MAP_FILE_PATH" && -f "$DART_OBFUSCATION_MAP_FILE_PATH" ]]; then
              upload_dart_symbol_map "$DART_OBFUSCATION_MAP_FILE_PATH" "$DART_SYMBOLS_FILE_PATH"
            fi
          else
            echo "::warning::No dart symbols found at '$DART_SYMBOLS_FILE_PATH' - skipping"
          fi
        fi

        if [[ -n "$DSYMS_PATH" ]]; then
          if [[ -d "$DSYMS_PATH" ]]; then
            upload_debug_files "$DSYMS_PATH"
            uploaded=$((uploaded + 1))
          else
            echo "::warning::No dSYMs found at '$DSYMS_PATH' - skipping"
          fi
        fi

        if [[ -n "$PROGUARD_MAPPING_FILE_PATH" ]]; then
          if [[ -f "$PROGUARD_MAPPING_FILE_PATH" ]]; then
            upload_proguard_mapping "$PROGUARD_MAPPING_FILE_PATH"
            uploaded=$((uploaded + 1))
          else
            echo "::warning::No ProGuard mapping found at '$PROGUARD_MAPPING_FILE_PATH' - skipping"
          fi
        fi

        if [[ "$uploaded" -eq 0 ]]; then
          echo "::warning::Nothing was uploaded to Sentry - no symbol paths were given"
        fi
    - name: Create & Finalize Sentry Release
      if: ${{ inputs.release != '' }}
      shell: bash
      env:
        SENTRY_AUTH_TOKEN: ${{ inputs.auth-token }}
        SENTRY_SERVER_URL: ${{ inputs.url }}
        ORGANIZATION: ${{ inputs.organization }}
        RELEASE: ${{ inputs.release }}
      run: |
        set -euo pipefail

        cli=(sentry-cli)
        if [[ -n "$SENTRY_SERVER_URL" ]]; then
          cli+=(--url "$SENTRY_SERVER_URL")
        fi

        "${cli[@]}" releases --org "$ORGANIZATION" new "$RELEASE"
        # Needs the full git history, which the release jobs do not check out.
        "${cli[@]}" releases --org "$ORGANIZATION" set-commits "$RELEASE" --auto \
          || echo "::warning::Could not associate commits with release '$RELEASE'"
        "${cli[@]}" releases --org "$ORGANIZATION" finalize "$RELEASE"
