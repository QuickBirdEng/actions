name: 'Upload debug symbols to sentry'
description: 'Upload debug symbols to sentry'
inputs:
  url:
    description: 'Url of the sentry server (in case of a custom one)'
    required: false
  project:
    description: 'Name of the project in sentry'
    required: false
  auth-token:
    description: 'Authorization token for sentry'
    required: false
  organization:
    description: 'Organization name'
    required: false
    default: ''
  symbols-dir:
    description: 'Directory holding one folder per platform as created by restore-debug-symbols (<platform>/dsyms, <platform>/dart-symbols, <platform>/proguard/mapping.txt). Alternative to passing the paths below individually.'
    required: false
    default: ''
  dsyms-path:
    description: 'The path to the dsYMs folder'
    required: false
    default: ''
  proguard-mapping-file-path:
    description: 'The path to the proguard mapping file'
    required: false
    default: ''
  dart-symbols-file-path:
    description: 'The path to the dart symbols file'
    required: false
    default: ''
  dart-obfuscation-map-file-path:
    description: 'The path to the dart obfuscation map JSON file'
    required: false
    default: ''
  release:
    description: 'Sentry release name to create and finalize (e.g. 1.0.0+12345). If empty, release finalization is skipped.'
    required: false
    default: ''
runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install CLI
      shell: bash
      run: npm install -g @sentry/cli
    - name: Sentry CLI Version
      shell: bash
      run: sentry-cli --version
    - name: Upload debug symbols
      shell: bash
      env:
        INPUT_AUTH_TOKEN: ${{ inputs.auth-token }}
        INPUT_URL: ${{ inputs.url }}
        INPUT_ORGANIZATION: ${{ inputs.organization }}
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_SYMBOLS_DIR: ${{ inputs.symbols-dir }}
        INPUT_DSYMS_PATH: ${{ inputs.dsyms-path }}
        INPUT_PROGUARD_MAPPING_FILE_PATH: ${{ inputs.proguard-mapping-file-path }}
        INPUT_DART_SYMBOLS_FILE_PATH: ${{ inputs.dart-symbols-file-path }}
        INPUT_DART_OBFUSCATION_MAP_FILE_PATH: ${{ inputs.dart-obfuscation-map-file-path }}
      run: bash "$GITHUB_ACTION_PATH/scripts/upload_debug_symbols_to_sentry.sh"
    - name: Create & Finalize Sentry Release
      if: ${{ inputs.release != '' }}
      shell: bash
      env:
        INPUT_AUTH_TOKEN: ${{ inputs.auth-token }}
        INPUT_URL: ${{ inputs.url }}
        INPUT_ORGANIZATION: ${{ inputs.organization }}
        INPUT_RELEASE: ${{ inputs.release }}
      run: bash "$GITHUB_ACTION_PATH/scripts/create_sentry_release.sh"
