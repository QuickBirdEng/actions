name: 'KEV monitor — is anything we run actively exploited?'
description: 'Daily check of the deployed version against the CISA KEV catalog, with a dated evidence record on every run'

inputs:
  product:
    description: 'Product name, used in the record and the alert'
    required: true
  repo:
    description: 'owner/repo to resolve the deployed version from'
    required: false
    default: ${{ github.repository }}
  policy-file:
    description: 'Per-product policy. Supplies cra_scope, the alert channel and the deadlines, validated against the process defaults.'
    required: false
    default: '.soup-policy.yml'
  cra-scope:
    description: >-
      Override for the policy's cra_scope — true | false | unknown. Normally left empty so
      the value comes from the policy file, where it is versioned and reviewable. Empty and
      with no policy file, the alert says the scope is unknown rather than assuming either
      way: assuming "false" is the one wrong answer with a legal consequence.
    required: false
    default: ''
  slack-channel-id:
    description: 'Channel to post to. Without it the run still produces its record; only the notification is skipped.'
    required: false
    default: ''
  slack-bot-token:
    description: 'Slack bot token'
    required: false
    default: ''
  evidence-dir:
    description: 'Where the dated run record is written'
    required: false
    default: 'kev-monitor'
  do-access-key:
    description: >-
      DigitalOcean Spaces access key. With it, the dated run record is also written to the
      quickbird-artifacts space, which is what makes it a durable record: the workflow artifact
      below is retained for 90 days, and an annual backstop has to reconcile 365.
    required: false
    default: ''
  do-secret-key:
    description: 'DigitalOcean Spaces secret key'
    required: false
    default: ''
  gh-token:
    description: 'Token for reading deployments and release assets'
    required: false
    default: ${{ github.token }}

outputs:
  verdict:
    description: 'all-clear | kev-findings | incomplete'
    value: ${{ steps.run.outputs.verdict }}
  record:
    description: 'Path to the dated run record'
    value: ${{ steps.run.outputs.record }}

runs:
  using: 'composite'
  steps:
    - name: Run the KEV check
      id: run
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
        CRA_SCOPE: ${{ inputs.cra-scope }}
        SOUP_POLICY_FILE: ${{ inputs.policy-file }}
      run: |
        set -o pipefail
        OUT="${{ inputs.evidence-dir }}"
        bash "$GITHUB_ACTION_PATH/../soup-discovery/scripts/monitor-kev.sh" \
          "${{ inputs.repo }}" "${{ inputs.product }}" "$OUT"
        REC=$(ls -1 "$OUT"/*-"${{ inputs.product }}".json | head -1)
        {
          echo "verdict=$(jq -r '.verdict' "$REC")"
          echo "record=$REC"
          echo "has-alert=$([ -s "$OUT/alert.txt" ] && echo true || echo false)"
        } >> "$GITHUB_OUTPUT"

    - name: Post to Slack
      if: ${{ steps.run.outputs.has-alert == 'true' && inputs.slack-channel-id != '' }}
      shell: bash
      env:
        SLACK_TOKEN: ${{ inputs.slack-bot-token }}
      run: |
        # curl rather than slackapi/slack-github-action: the alert is multi-line markdown
        # assembled by the script, and routing it through the action's YAML payload template
        # mangles the newlines. chat.postMessage is the same API either way.
        BODY=$(cat "${{ inputs.evidence-dir }}/alert.txt")
        jq -n --arg ch "${{ inputs.slack-channel-id }}" --arg t "$BODY" \
          '{channel:$ch, text:$t, mrkdwn:true}' \
        | curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_TOKEN" \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data @- | jq -e '.ok' >/dev/null \
          || echo "::error::Slack post failed — the run record was still written"

    # The durable copy. Written with the same action and into the same space as the mobile build
    # artifacts, so the retention and access rules are the ones already in place. The workflow
    # artifact below is kept for 90 days; an annual backstop has to reconcile 365, which is why
    # this step exists.
    #
    # Path: <repo>/soup-evidence/<year>/. The year segment lets a yearly backstop sync one prefix
    # rather than the whole history.
    - name: Resolve the evidence path
      id: evidence
      if: ${{ always() && inputs.do-access-key != '' }}
      shell: bash
      run: |
        REC=$(ls -1 "${{ inputs.evidence-dir }}"/[0-9]*-*.json 2>/dev/null | head -1)
        if [ -z "$REC" ]; then
          echo "::error::no dated run record to store — this run produced no evidence that"
          echo "::error::  ${{ inputs.product }} was monitored, so it must not be treated as a clean run"
          exit 1
        fi
        echo "record=$REC" >> "$GITHUB_OUTPUT"
        echo "out-dir=${{ github.event.repository.name }}/soup-evidence/$(basename "$REC" | cut -d- -f1)" >> "$GITHUB_OUTPUT"

    - name: Store the record durably
      if: ${{ always() && inputs.do-access-key != '' && steps.evidence.outputs.record != '' }}
      # Pinned to an exact release: this action publishes no moving major tag, so `@v2` does not
      # resolve. Its newest release is v2.0.146 from 2024-02-12, which is over two years old and
      # would be an obsolescence finding under §11 if it were a product dependency. The existing
      # upload-artifact-qb action in this repository uses `@latest` for the same upload, which is
      # worth revisiting separately.
      uses: BetaHuhn/do-spaces-action@v2.0.146
      with:
        access_key: ${{ inputs.do-access-key }}
        secret_key: ${{ inputs.do-secret-key }}
        space_name: quickbird-artifacts
        space_region: fra1
        source: ${{ steps.evidence.outputs.record }}
        out_dir: ${{ steps.evidence.outputs.out-dir }}

    - name: Keep the record
      if: always()
      uses: actions/upload-artifact@v4
      with:
        # Retained on every run, including all-clear ones. The dated record is what
        # distinguishes "we checked and found nothing" from "nobody looked", and only the
        # second of those is a finding at an audit.
        name: kev-monitor-${{ inputs.product }}
        path: ${{ inputs.evidence-dir }}
        retention-days: 90

    - name: Summary
      if: always()
      shell: bash
      run: |
        V="${{ steps.run.outputs.verdict }}"
        case "$V" in
          all-clear)    echo "### KEV monitor: all clear" ;;
          kev-findings) echo "### KEV monitor: ACTIVELY EXPLOITED vulnerability in the running version" ;;
          incomplete)   echo "### KEV monitor: could not complete — this is not an all-clear" ;;
        esac >> "$GITHUB_STEP_SUMMARY"
        [ -s "${{ inputs.evidence-dir }}/alert.txt" ] && {
          echo '```'; cat "${{ inputs.evidence-dir }}/alert.txt"; echo '```'
        } >> "$GITHUB_STEP_SUMMARY" || true
